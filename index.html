<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/style/style.css">
    <title>Sharkie</title>
</head>
<body>
    <main class="w-full">
        <header>
            <h1 class="font-lucky">Sharkie</h1>
        </header>
        <div class="w-full content">
            <div class="canvas-container">
                <canvas id="canvas"
                class="w-full h-full cvs-full"></canvas>
                <overlay-controls class="overlay cvs-full">
                    <div class="control-container">
                        <div class="control-group">
                            <div class="control-keys">
                                <div></div>
                                <div class="key">&uparrow;</div>
                                <div></div>
                                <div class="key">&leftarrow;</div>
                                <div class="key">&downarrow;</div>
                                <div class="key">&rightarrow;</div>
                            </div>
                            <h3 class="font-lucky">Moving</h3>
                        </div>
                        <div class="control-group">
                            <div class="control-keys">
                                <div class="key wide-key">CTRL</div>
                            </div>
                            <h3 class="font-lucky">Bubble shot</h3>
                        </div>
                        <div class="control-group">
                            <div class="control-keys">
                                <div class="key wide-key">SPACE</div>
                            </div>
                            <h3 class="font-lucky">Slap Pufferfhish</h3>
                        </div>
                    </div>
                </overlay-controls>
                <button id="btn-run" class="btn-control font-lucky"></button>
                <button id="btn-menu" class="btn-control font-lucky"></button>
                <button id="btn-controls" class="btn-control font-lucky"></button>
            </div>
        </div>
    </main>
    <script src="src/app.js" type="module"></script>
</body>
</html>
